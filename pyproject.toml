[project]
name = "dynamic-ai-customer-support"
version = "2.0.0"
description = "Production-grade async AI customer support backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "celery>=5.5.3",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "numpy>=1.26,<2.4",
    "passlib[bcrypt]>=1.7.4",
    "prometheus-client>=0.22.1",
    "pydantic-settings>=2.11.0",
    "pyjwt>=2.10.1",
    "pytest>=9.0.3",
    "python-multipart>=0.0.20",
    "redis>=6.4.0",
    "sentry-sdk[fastapi]>=2.32.0",
    "slowapi>=0.1.9",
    "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
vector = [
    "asyncpg>=0.30.0",
    "faiss-cpu>=1.12.0",
    "pinecone>=7.3.0",
    "weaviate-client>=4.17.0",
]
inference = [
    "onnxruntime>=1.23.1",
    "vllm>=0.11.0",
]
dev = [
    "bandit>=1.8.6",
    "black>=25.9.0",
    "locust>=2.42.0",
    "mypy>=1.18.2",
    "pip-audit>=2.7.3,<3.0.0",
    "pylint>=4.0.3",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.3",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
src = ["backend/app"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S"]
ignore = ["E501", "N818", "S101", "S105", "S106", "UP042"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = false
no_implicit_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=backend/app --cov-report=term-missing --cov-fail-under=80"
asyncio_mode = "auto"
testpaths = ["backend/app/tests"]

[tool.pylint.main]
py-version = "3.11"
ignore = ["experiments"]
